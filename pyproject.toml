[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project3"
version = "1.0.0"
description = "Depends on project2"
requires-python = ">=3.8"
dependencies = ["project2"]

[tool.setuptools]
packages = ["project3"]
package-dir = {"project3" = "."}
